# Copy this to /etc/nginx/sites-available/morocco-visa on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/morocco-visa /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# Only touches this one server block — existing sites are untouched.

server {
    listen 80;
    server_name moroccovisaservice.com www.moroccovisaservice.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
